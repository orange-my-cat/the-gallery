[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = core jobs library organise fileops duplicates places people

# 80% line coverage is the floor, not the goal. Coverage measures lines
# executed, not files proven safe; the real controls for the file-handling code
# that arrives later are the Hypothesis properties and the fault-injection
# suite described in the HLD's "Testing and operations".
addopts =
    --strict-markers
    --cov=.
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=80

# WhiteNoise warns once per client when STATIC_ROOT has not been collected,
# which is always true outside the image.
filterwarnings =
    ignore:No directory at:UserWarning
