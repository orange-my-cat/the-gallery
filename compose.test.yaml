name: gallery-test

# Optional. The default test target is `data-center-test` at localhost:5433,
# where Django creates and drops `test_gallery` per run, leaving development
# data intact.
#
# This file provides a throwaway PostgreSQL on tmpfs instead, which is
# materially faster and leaves nothing behind. Use it when the suite is being
# run in a tight loop, or before the `gallery` role exists on data-center-test.
#
#     docker compose -f compose.test.yaml up -d --wait
#     cd backend
#     $env:POSTGRES_PORT=5434; $env:POSTGRES_DB="gallery_ci"; $env:POSTGRES_USER="gallery"; $env:POSTGRES_PASSWORD="gallery"; pytest
#     docker compose -f compose.test.yaml down
#
# Port 5434 is deliberate: it is one further from 5432 than 5433 is, and this
# instance holds nothing, so a mistyped digit here costs nothing. Bound to
# 127.0.0.1 only.

services:
  gallery-testdb:
    image: postgres:18.4
    container_name: gallery-testdb
    restart: "no"
    environment:
      POSTGRES_DB: gallery_ci
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      # Never touches disk; nothing here survives a stop.
      #
      # Mounted at /var/lib/postgresql, not /var/lib/postgresql/data. The
      # PostgreSQL 18 images place data in a major-version subdirectory and
      # refuse to start if they find a mount at the old path.
      - /var/lib/postgresql:mode=1777
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery_ci"]
      interval: 3s
      timeout: 3s
      retries: 20
