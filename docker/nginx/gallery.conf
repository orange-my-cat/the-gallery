# The Gallery vhost for central-station.
#
# This is the canonical copy and it travels with the application. The file
# nginx actually reads lives in the platform repository:
#
#     d:\Repositories\vibe-city\nginx\conf.d\gallery.conf
#
# Install it with:
#
#     cp docker/nginx/gallery.conf d:/Repositories/vibe-city/nginx/conf.d/
#     docker exec central-station nginx -t
#     docker exec central-station nginx -s reload
#
# ---------------------------------------------------------------------------
# PREREQUISITE: central-station mounts the library drives and the cache READ-ONLY
# ---------------------------------------------------------------------------
# The two `internal` locations below alias paths inside central-station, which
# d:\Repositories\vibe-city\start.ps1 mounts:
#
#     --mount "type=bind,source=D:/,target=/srv/gallery/library/D,readonly"
#     --mount "type=volume,source=gallery-cache,target=/srv/gallery/cache,readonly"
#
# One bind per drive in LIBRARY_DRIVES (.env.production), mirroring how the
# `gallery` container mounts them at /library/<letter>. Without these mounts
# the vhost still loads, but every media request 404s.
#
# ---------------------------------------------------------------------------
# DO NOT INSTALL THIS BEFORE THE `gallery` CONTAINER EXISTS.
# ---------------------------------------------------------------------------
# `proxy_pass` to a literal hostname is resolved when nginx starts, not per
# request. With no `gallery` container on the vibe-city network, nginx fails
# to start - and central-station is shared, so that takes every other
# *.localhost app down with it. Validate with `nginx -t` before reloading.

server {
    listen 80;
    server_name gallery.localhost;

    # Nothing is uploaded through the browser; the library is a folder on disk.
    client_max_body_size 4m;

    # -----------------------------------------------------------------------
    # Media bytes - reachable only through X-Accel-Redirect from Django
    # -----------------------------------------------------------------------
    # Django checks the session, looks the file up by id and answers with
    #     X-Accel-Redirect: /_protected/library/D/<percent-encoded path>
    # or  X-Accel-Redirect: /_protected/cache/thumbs/ab/abcdef..._400.webp
    # plus the Content-Type, Content-Disposition and Cache-Control it wants.
    # Nginx then streams the file itself, with Range support and sendfile, so
    # video seeking works and no Gunicorn worker is held by a long download.
    #
    # `internal` means a browser asking for /_protected/... directly gets a
    # 404. The prefixes must match MEDIA_ACCEL_LIBRARY_PREFIX and
    # MEDIA_ACCEL_CACHE_PREFIX in backend/config/settings/base.py.

    location /_protected/library/ {
        internal;
        alias /srv/gallery/library/;
        sendfile on;
        tcp_nopush on;
        error_page 403 404 = @media_unavailable;
    }

    location /_protected/cache/ {
        internal;
        alias /srv/gallery/cache/;
        sendfile on;
        tcp_nopush on;
        error_page 403 404 = @media_unavailable;
    }

    # A file Nginx cannot open. The error still carries Django's
    # `immutable, max-age=31536000` - Nginx keeps the upstream Cache-Control
    # on an X-Accel error - so the browser would hold the failure for a year
    # under the same URL. `no-store` beside it wins; the next request retries.
    location @media_unavailable {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # -----------------------------------------------------------------------
    # Everything else - the SPA, /api and /media - goes to the app
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://gallery:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # There is no TLS anywhere in this topology, so Django's
        # SECURE_PROXY_SSL_HEADER stays unset. If central-station ever
        # terminates TLS in front of this, set it then and not before.
    }
}
